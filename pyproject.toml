[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sih-2026-genai-platform"
version = "0.1.0"
description = "Gen AI Platform for Automated Content Transformation — SIH 2026"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "bcrypt>=4,<5",
    "PyJWT>=2,<3",
    "email-validator>=2,<3",
    "python-multipart>=0.0.9,<1",
    "pypdf>=4,<7",
    "python-docx>=1.1,<2",
    "lxml>=5,<7",
    "PyYAML>=6,<7",
    "python-pptx>=1,<2",
    "xlrd>=2,<3",
    "python-evtx>=0.8,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "xlwt>=1.3,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/**" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
